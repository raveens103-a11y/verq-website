# verQ Netlify Configuration

[[redirects]]
  from = "/post-a-requirement"
  to = "/post-requirement.html"
  status = 301

[[redirects]]
  from = "/join-as-hr-partner"
  to = "/join-hr-partner.html"
  status = 301

[[redirects]]
  from = "/referral-program"
  to = "/referral.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
