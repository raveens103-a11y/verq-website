[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/post-a-requirement"
  to = "/post-requirement.html"
  status = 301

[[redirects]]
  from = "/join-as-hr-partner"
  to = "/join-hr-partner.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
