<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Application Received! | verQ</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/theme.css"/>
<style>
.success-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 24px; position: relative; z-index: 1; }
.success-box { text-align: center; max-width: 480px; }
.s-icon { width: 80px; height: 80px; border: 2px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 28px; font-size: 36px; color: var(--accent); box-shadow: var(--glow); }
.s-title { font-family: "Space Grotesk", sans-serif; font-size: 32px; font-weight: 700; color: var(--white); margin-bottom: 12px; letter-spacing: -1px; }
.s-sub { font-size: 16px; color: var(--muted); line-height: 1.7; margin-bottom: 36px; }
.s-home { display: inline-block; background: var(--accent); color: #0A0A0F; padding: 14px 32px; border-radius: 8px; font-family: "Space Grotesk", sans-serif; font-size: 14px; font-weight: 700; text-decoration: none; margin-right: 12px; box-shadow: var(--glow); }
.s-back { display: inline-block; border: 1px solid var(--border); color: var(--white); padding: 14px 32px; border-radius: 8px; font-family: "Space Grotesk", sans-serif; font-size: 14px; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">ver<span>Q</span></a>
</nav>
<div class="success-page">
  <div class="success-box">
    <div class="s-icon">✓</div>
    <div class="s-title">Application Received!</div>
    <div class="s-sub">Naveen from verQ will personally review your profile and reach out within 48 hours to discuss next steps.</div>
    <a href="/" class="s-home">Back to verQ →</a>
    <a href="/join-hr-partner.html" class="s-back">Submit Another Application</a>
  </div>
</div>



<script>
function toggleMenu() {
  const links = document.querySelector('.nav-links');
  const burger = document.getElementById('hamburger');
  if (!links || !burger) return;
  const isOpen = links.classList.contains('open');
  if (isOpen) { links.classList.remove('open'); burger.classList.remove('open'); document.body.style.overflow = ''; }
  else { links.classList.add('open'); burger.classList.add('open'); document.body.style.overflow = 'hidden'; }
}
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.nav-links a').forEach(function(a) {
    a.addEventListener('click', function() {
      document.querySelector('.nav-links')?.classList.remove('open');
      document.getElementById('hamburger')?.classList.remove('open');
      document.body.style.overflow = '';
    });
  });
  document.addEventListener('click', function(e) {
    const nav = document.querySelector('nav');
    const links = document.querySelector('.nav-links');
    if (nav && !nav.contains(e.target) && links?.classList.contains('open')) {
      links.classList.remove('open');
      document.getElementById('hamburger')?.classList.remove('open');
      document.body.style.overflow = '';
    }
  });
});
</script>
</body>
</html>
